<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>ST-Lotsen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c2b36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ST-Lotsen">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --ink: #1c2b36;
      --ink-soft: #5b6b75;
      --bg: #e4e9ec;
      --card: #ffffff;
      --line: #c7d1d7;
      --chrome: #1c2b36;
      --accent: #b5641a;
      --accent-soft: #f4e6d5;
      --interest: #2e5b8a;
      --interest-soft: #e3edf7;
      --today: #1c2b36;
      --danger: #b03020;
      --ok: #2f6f4f;
    }
    * { box-sizing: border-box; }
    html { overscroll-behavior-x: none; font-size: 16px; }
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 18px;
      color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%;
    }
    h1, h2, h3 { margin: 0 0 10px; color: var(--ink); }
    h1 { font-size: 22px; }
    h2 { font-size: 19px; }
    button { font: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    .muted { color: var(--ink-soft); }
    .err { color: var(--danger); font-weight: bold; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ── App-skal ─────────────────────────────────────────── */
    header {
      background: var(--chrome); color: #eef1f3;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    header .brand { display: flex; align-items: center; gap: 10px; color: #eef1f3; text-decoration: none; min-width: 0; }
    header .brand img { border-radius: 8px; flex: none; }
    header .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    header .brand-name { font-weight: bold; font-size: 17px; letter-spacing: 0.2px; }
    header .clinic { font-size: 12px; color: #9fb2c0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Navigering (hybrid): modulflikar i headern, modulens undersidor i en vänsterspalt (mobil: vågrät rad under headern). */
    #worlds { display: flex; gap: 2px; align-self: stretch; margin: -12px 0 -12px 8px; }
    #worlds a { display: flex; align-items: center; padding: 0 16px; color: #c6d3dc; text-decoration: none; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; }
    #worlds a:hover { color: #fff; }
    #worlds a.active { color: #fff; font-weight: bold; border-bottom-color: #e8a35c; background: rgba(255,255,255,0.07); }
    header .spacer { flex: 1; }
    #tools { display: flex; align-items: center; gap: 6px; }
    header .iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 34px; padding: 0; color: #eef1f3; text-decoration: none; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28); border-radius: 5px; }
    header .iconbtn.active { background: #e8a35c; border-color: #e8a35c; color: var(--chrome); }
    header .iconbtn svg { width: 20px; height: 20px; }
    #menu-wrap { position: relative; }
    #menu-btn { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 190px; background: #fff; border: 1.5px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(20,30,38,0.28); z-index: 20; overflow: hidden; }
    header #menu a, header #menu button { display: block; width: 100%; text-align: left; padding: 13px 16px; font-size: 16px; color: var(--ink); text-decoration: none; background: none; border: none; border-radius: 0; }
    header #menu a:hover, header #menu button:hover { background: #eef1f3; }
    header #menu a.active { font-weight: bold; background: var(--accent-soft); }
    header #menu hr { border: none; border-top: 1px solid var(--line); margin: 0; }
    .shell { display: flex; align-items: flex-start; }
    .shell > main { flex: 1; min-width: 0; }
    #subnav { flex: none; width: 210px; position: sticky; top: 0; min-height: calc(100vh - 60px); background: #fff; border-right: 1px solid var(--line); padding: 12px 0; }
    #subnav .sn-title { padding: 4px 18px 8px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); }
    #subnav a { display: block; padding: 10px 18px; font-size: 15px; color: var(--ink); text-decoration: none; border-right: 3px solid transparent; }
    #subnav a:hover { background: #eef1f3; }
    #subnav a.active { background: var(--accent-soft); color: var(--accent); font-weight: bold; border-right-color: var(--accent); }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; padding-bottom: 0; row-gap: 8px; }
      #worlds { order: 3; flex: 0 0 calc(100% + 32px); margin: 0 -16px; height: 42px; border-top: 1px solid rgba(255,255,255,0.12); }
      #worlds a { flex: 1 1 auto; justify-content: center; padding: 0 6px; font-size: 14px; }
      #menu-btn { max-width: 120px; }
      .shell { display: block; }
      #subnav [data-world] { display: flex; }
      #subnav { position: relative; width: auto; min-height: 0; overflow-x: auto; padding: 0 8px; border-right: none; border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
      #subnav .sn-title { display: none; }
      #subnav a { padding: 11px 12px; font-size: 14px; white-space: nowrap; border-right: none; border-bottom: 3px solid transparent; }
      #subnav a.active { background: none; border-bottom-color: var(--accent); }
    }
    header button {
      background: rgba(255,255,255,0.12); color: #eef1f3;
      border: 1px solid rgba(255,255,255,0.28); border-radius: 5px; padding: 7px 12px; font-size: 14px;
    }
    main { max-width: 920px; margin: 0 auto; padding: 16px; }
    main#view.wide { max-width: 1440px; }
    @media (min-width: 1100px) { main#view.wide { padding: 20px 28px; } }

    .card {
      background: var(--card); border: 1.5px solid var(--line); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(20,30,38,0.06);
    }

    input[type=text], input[type=password], input[type=tel], input[type=number], input[type=date], input[type=month], input[type=search], select {
      width: 100%; max-width: 360px; padding: 11px 10px; font-size: 17px;
      border: 1.5px solid var(--line); border-radius: 5px; background: #eef1f3; color: var(--ink);
    }
    label { display: block; font-weight: bold; margin: 10px 0 4px; font-size: 15px; }

    .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 11px 18px; font-size: 16px; font-weight: bold;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-ghost { background: none; border: 1.5px solid var(--line); color: var(--ink); border-radius: 6px; padding: 9px 14px; font-size: 14px; font-weight: bold; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { flex: 1; padding: 9px; border: 1.5px solid var(--line); background: #eef1f3; border-radius: 6px; font-size: 14px; }
    .tabs button.active { background: var(--chrome); color: #fff; border-color: var(--chrome); }
    .status { margin-top: 10px; font-size: 14px; }
    .status.ok { color: var(--ok); }

    /* ── Kalender ─────────────────────────────────────────── */
    .cal-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .cal { min-width: 860px; }
    .cal-head, .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-head div { text-align: center; font-size: 13px; font-weight: bold; color: var(--ink-soft); text-transform: uppercase; padding: 5px 0; }
    .cal-week { margin-bottom: 6px; }
    .day {
      --cellbg: var(--card);
      background: var(--cellbg); border: 1.5px solid var(--line); border-radius: 8px;
      min-height: 116px; padding: 9px 11px; font-size: 14.5px; text-align: left;
      display: flex; flex-direction: column; gap: 4px; width: 100%; color: var(--ink);
    }
    .day .dnum { font-size: 12.5px; color: var(--ink-soft); font-weight: bold; }
    .day.other { opacity: 0.45; }
    .day.today { border-color: var(--today); border-width: 2.5px; scroll-margin-top: 12px; }
    .day.past { --cellbg: #eef1f3; }
    .day.past .dnum::after { content: ' · låst'; font-weight: normal; }
    .day .who { font-weight: bold; font-size: 15.5px; line-height: 1.2; overflow-wrap: anywhere; }
    .day .res { color: var(--ink-soft); font-style: italic; line-height: 1.2; }
    .day.mine { --cellbg: var(--accent-soft); border-color: var(--accent); }
    .day.clickable { cursor: pointer; }
    .day.clickable:hover { border-color: var(--accent); }
    .day.clickable:focus-visible { outline: 3px solid var(--interest); outline-offset: 2px; }
    .day .pn { font-weight: bold; }
    .day ul.plist.cell { display: flex; flex-direction: column; gap: 4px; }
    .day ul.plist.cell li { padding: 0; }
    .cal-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
    .cal-nav .cal-range { flex: 1 1 200px; text-align: center; font-weight: bold; color: var(--ink); }
    .cal-nav button { font-size: 14px; padding: 9px 14px; }
    .day .dwd, .day .dn-dm { display: none; }
    .day .today-pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 9px; background: var(--today); color: #fff; font-size: 10px; letter-spacing: 0.4px; vertical-align: 1px; }
    .day.today { box-shadow: 0 0 0 3px rgba(28,43,54,0.16); }
    .day .cphone { font-size: 12px; }
    .day .plist.cell { margin: 0; font-size: 12px; line-height: 1.3; }
    .badge-admin { font-size: 10px; color: var(--accent); font-weight: bold; }
    .day .tag { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.3px; color: var(--interest); }
    .day .ints { font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
    .day.has-interest { --cellbg: var(--interest-soft); border-color: #9bb8d6; }
    .day.my-interest { border-style: dashed; border-color: var(--interest); }

    /* Dator: klickbara celler har fast höjd. Får inte allt plats döljs resten och cellen märks "Visa mer" (hela dagen visas vid klick). */
    @media (min-width: 641px) {
      .day.clickable { height: 124px; min-height: 0; overflow: hidden; position: relative; }
      .day.clipped::after {
        content: 'Visa mer ▸'; position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 11px 5px;
        background: linear-gradient(to bottom, transparent, var(--cellbg) 65%);
        font-size: 11px; font-weight: bold; color: var(--interest); text-align: right; pointer-events: none;
      }
    }

    /* Dagsvy (bottom sheet på mobil, dialog på bredare skärmar) */
    .overlay { position: fixed; inset: 0; background: rgba(20,30,38,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
    .sheet { background: var(--card); width: 100%; max-width: 520px; max-height: 85vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
    @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 14px; } }
    .sheet h2 { display: flex; justify-content: space-between; align-items: center; }
    .sheet h3 { font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; margin: 16px 0 4px; }
    .chip { display: inline-block; background: var(--interest-soft); border: 1px solid #9bb8d6; border-radius: 14px; padding: 3px 11px; margin: 3px 4px 3px 0; font-size: 15px; }
    .chip.me { background: var(--accent-soft); border-color: var(--accent); font-weight: bold; }
    .btn-interest { background: var(--interest); }
    .btn-danger { background: var(--danger); }
    .btn-block { width: 100%; margin-top: 8px; }
    .hint { font-size: 14px; color: var(--ink-soft); margin: 6px 0 0; }
    .phone { color: var(--interest); font-weight: bold; text-decoration: none; white-space: nowrap; }
    .plist { list-style: none; margin: 6px 0 0; padding: 0; }
    .plist li { padding: 3px 0; }
    /* Mobil: kalendern blir en lodrät lista, en rad per dag, veckorubrik per vecka (ingen sidscroll) */
    @media (max-width: 640px) {
      main { padding: 12px; }
      .card { padding: 12px; }
      .cal { min-width: 0; }
      .cal-head { display: none; }
      .cal-nav .cal-range { order: -1; flex-basis: 100%; }
      .cal-nav button { flex: 1 1 40%; }
      .cal-week { grid-template-columns: 1fr; gap: 4px; margin-bottom: 12px; }
      .cal-week::before { content: attr(data-week); font-size: 12px; font-weight: bold; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 2px 0; }
      .day { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-height: 46px; padding: 8px 10px; font-size: 15px; }
      .day.past { min-height: 36px; padding-top: 5px; padding-bottom: 5px; }
      .day .dnum { flex: 0 0 100%; font-size: 14px; color: var(--ink); }
      .day .dwd, .day .dn-dm { display: inline; }
      .day .dn-short { display: none; }
      .day .plist.cell { width: 100%; font-size: 14px; }
      .day { min-height: 0; }
      .day .who { font-size: 15px; }
      .day .tag { font-size: 11px; }
      .day .ints { font-size: 14px; }
      .day .res { font-size: 14px; }
      .big-today .name { font-size: 28px; }
    }
    h1.page { margin: 4px 0 14px; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; margin: 0; font-weight: normal; font-size: 17px; }
    .switch-row .sub { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .switch { position: relative; flex: none; display: inline-block; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch .track { display: block; width: 54px; height: 32px; border-radius: 16px; background: #b3bec6; position: relative; transition: background .18s; }
    .switch .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .18s; }
    .switch input:checked + .track { background: var(--ok); }
    .switch input:checked + .track .knob { transform: translateX(22px); }
    .switch input:focus-visible + .track { outline: 3px solid var(--interest); outline-offset: 2px; }
    .switch input:disabled + .track { opacity: .45; }
    .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
    .opt-row:first-of-type { border-top: none; }
    .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { background: #fff; border: none; padding: 9px 14px; font-size: 14px; border-right: 1px solid var(--line); }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--chrome); color: #fff; font-weight: bold; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .stat-grid .card { margin-bottom: 0; }
    .stat-big { font-size: 46px; font-weight: bold; line-height: 1; }
    .bar { background: #e3e9ed; border-radius: 5px; height: 12px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
    .bar.blue > span { background: var(--interest); }
    .brow { display: grid; grid-template-columns: minmax(110px, 170px) 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; }
    .brow .n { font-variant-numeric: tabular-nums; color: var(--ink-soft); min-width: 62px; text-align: right; }
    .cols { display: flex; align-items: flex-end; gap: 4px; height: 130px; margin-top: 8px; }
    .cols .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
    .cols .c i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
    .cols .c.blue i { background: var(--interest); }
    .cols .c span { font-size: 10.5px; color: var(--ink-soft); margin-top: 4px; white-space: nowrap; }
    .cols .c b { font-size: 11px; margin-bottom: 2px; font-weight: normal; color: var(--ink-soft); }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .stats-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--ink-soft); padding: 4px 8px 6px 0; }
    .stats-table td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); vertical-align: middle; }
    .stats-table td.num, .stats-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .field-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field-row > div { flex: 1 1 220px; }
    .check { display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer; margin: 10px 0 0; }
    .check input { width: 20px; height: 20px; }
    .notice { border-left: 5px solid var(--ok); background: #eaf4ee; }
    .notice.warn { border-left-color: var(--accent); background: var(--accent-soft); }
    .ulist .ublock { border-top: 1px solid var(--line); }
    .ulist .ublock:first-child { border-top: none; }
    .ulist .uhead { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; justify-content: space-between; padding: 8px 2px 4px; }
    .ulist .uinfo { flex: 1 1 280px; min-height: 44px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; text-align: left;
      background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 0; box-shadow: none; }
    .ulist .uinfo::before { content: '▸'; color: var(--ink-soft); }
    .ulist .ublock.open .uinfo::before { content: '▾'; }
    .ulist .uinfo.plain { cursor: default; }
    .ulist .uinfo.plain::before { content: none; }
    .ulist .uname { font-weight: bold; }
    .ulist .uuser { color: var(--ink-soft); font-size: 14px; }
    .ulist .qsws { display: grid; grid-auto-flow: column; grid-auto-columns: 64px; gap: 4px; flex: none; }
    .ulist .qsw { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0; padding: 2px 0; font-size: 11.5px; font-weight: normal; color: var(--ink-soft); cursor: pointer; }
    .ulist .status { margin: 0 2px 6px; }
    .ulist .status:empty { display: none; }
    .ulist .body { display: none; padding: 0 2px 14px 20px; }
    .ulist .ublock.open .body { display: block; }
    /* Startsidan Idag (js/today.js) */
    .today-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
    .today-grid .card { margin: 0; }
    .today-card a { color: var(--interest); font-weight: bold; }
    .today-card .sact { font-size: 14px; padding: 2px 8px; }
    .today-card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-soft); margin-bottom: 8px; }
    .today-sub { font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-soft); margin: 14px 0 4px; }
    .big-name { font-size: 24px; font-weight: bold; }
    .todo, .today-list { list-style: none; margin: 0; padding: 0; }
    .todo li, .today-list li { padding: 6px 0; border-top: 1px solid #eef1f3; }
    .todo li:first-child, .today-list li:first-child { border-top: none; }
    .today-list .muted { display: inline-block; min-width: 64px; font-size: 14px; }
    .staff-row { display: flex; gap: 6px; }
    .staff-row div { flex: 1; text-align: center; background: #f2f5f7; border-radius: 6px; padding: 6px 2px; }
    .staff-row div.cur { background: var(--accent-soft); outline: 1.5px solid var(--accent); }
    .staff-row span { display: block; font-size: 12px; color: var(--ink-soft); }
    .staff-row strong { font-size: 20px; }
    .pbar { height: 12px; border-radius: 6px; background: #e3e8eb; overflow: hidden; }
    .pbar span { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
    /* Användarlista (U1) */
    .urows { display: flex; flex-direction: column; }
    .urow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; text-align: left; background: none; border: none; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 6px; font: inherit; color: inherit; }
    .urow:first-child { border-top: none; }
    .urow:hover, .urow.on { background: var(--accent-soft); }
    .urow .uname { font-weight: bold; min-width: 160px; }
    .urow .uuser { color: var(--ink-soft); font-size: 14px; min-width: 120px; }
    .urow .uchips { display: flex; flex-wrap: wrap; gap: 4px; }
    .role-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0; padding: 10px 0; border-top: 1px solid #eef1f3; font-weight: normal; cursor: pointer; }
    .role-row small, .role-info small { display: block; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
    .role-info { padding: 10px 0; border-top: 1px solid #eef1f3; font-size: 15px; }
    .sidepanel input[type=text], .sidepanel input[type=tel], .sidepanel select { max-width: none; }
    .tagchip { display: inline-block; font-size: 11px; font-weight: bold; padding: 1px 8px; border-radius: 9px; background: #eef1f3; color: var(--ink-soft); border: 1px solid var(--line); }

<body>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:8080'
      : 'https://opjour-backend-110110585004.europe-north1.run.app'; // byts när domänen är vald (opjour_migrationsplan.md §12)

    const APP_VERSION = '0.21.0';   // håll lika med opjour-backend/package.json (snapshot.sh kontrollerar)

    const SV_DAYS = ['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'];
    const SV_DAYS_FULL = ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag', 'Söndag'];
    const SV_MONTHS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

    const state = {
      token: localStorage.getItem('opjour_token') || null,
      scope: localStorage.getItem('opjour_scope') || null,
      clinicName: localStorage.getItem('opjour_clinic') || ''
    };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function el(id) { return document.getElementById(id); }

    // ── Felrapportering (som MoraDOPS) ─────────────────────────────────────
    // Sessionslogg (senaste 30 felen och misslyckade anrop) som bifogas en felanmälan. Okontrollerade fel rapporteras
    // automatiskt till servern (Admin → Felrapporter); console.error och avvisade promises bara om de ser ut som kodfel.
    // Nätverks- och sessionsfel räknas inte. Max 10 unika per sidladdning, samma fel bara en gång.
    const _sessionLog = [];
    function logSession(entry) { _sessionLog.push(Object.assign({ t: new Date().toISOString() }, entry)); if (_sessionLog.length > 30) _sessionLog.shift(); }
    const _NOISE_RE = /Failed to fetch|NetworkError|Load failed|network connection|AbortError|aborted|Sessionen har gått ut|^Script error\.?$|ResizeObserver loop/i;
    const _BUG_RE = /\b(TypeError|ReferenceError|RangeError|SyntaxError)\b|is not defined|is not a function|Cannot read propert|Cannot set propert|before initialization|undefined is not an object|null is not an object|is not iterable|Maximum call stack/;
    const _reported = new Set();
    let _reporting = false;
    function reportClientError(type, message, source) {
      const msg = String(message || '').slice(0, 1000);
      if (!msg || !state.token || _reporting || _NOISE_RE.test(msg)) return;
      const key = msg + '|' + (source || '');
      if (_reported.has(key) || _reported.size >= 10) return;
      _reported.add(key);
      _reporting = true;   // ett misslyckat rapportanrop får inte rapportera sig självt
      try { api('/error-reports/client-errors', { method: 'POST', body: { type, message: msg, source: source || null, appVersion: APP_VERSION, page: location.hash || '#/' } }).catch(() => {}); }
      catch (e) { /* tyst */ } finally { _reporting = false; }
    }
    const _origConsoleError = console.error;
    console.error = function (...args) {
      try {
        const msg = args.map(a => (a && a.stack) ? a.stack.split('\n')[0] : String(a)).join(' ');
        logSession({ type: 'console', message: msg });
        if (_BUG_RE.test(msg)) reportClientError('console', msg);
      } catch (e) { /* tyst */ }
      _origConsoleError.apply(console, args);
    };
    window.addEventListener('error', e => {
      const source = (e.filename || '').replace(location.origin, '') + ':' + e.lineno;
      logSession({ type: 'window', message: e.message, source });
      reportClientError('window', e.message, source);
    });
    window.addEventListener('unhandledrejection', e => {
      const msg = String(e.reason && e.reason.stack ? e.reason.stack.split('\n')[0] : e.reason);
      logSession({ type: 'promise', message: msg });
      if (_BUG_RE.test(msg)) reportClientError('promise', msg);
    });

    // Felanmälan: ruta där användaren beskriver problemet; teknisk information bifogas automatiskt.
    function openFeedback(e) {
      if (e) e.preventDefault();
      closeMenu();
      let root = el('feedback-root');
      if (!root) { root = document.createElement('div'); root.id = 'feedback-root'; document.body.appendChild(root); }
      root.innerHTML = `
        <div class="overlay" onclick="if(event.target===this)closeFeedback()">
          <div class="sheet" role="dialog" aria-label="Felanmälan">
            <h2>Felanmälan <button class="link-btn" style="color:var(--ink-soft);text-decoration:none;font-size:22px" onclick="closeFeedback()" aria-label="Stäng">✕</button></h2>
            <p class="hint" style="margin-top:0">Beskriv vad du gjorde och vad som hände, eller ge ett förbättringsförslag. Version, sida, webbläsare och de senaste felen i appen bifogas automatiskt.</p>
            <textarea id="fb-message" rows="6" maxlength="4000" style="width:100%;font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:6px" placeholder="Vad hände?"></textarea>
            <button class="btn btn-block" onclick="sendFeedback()">Skicka</button>
            <div class="status" id="fb-status"></div>
          </div>
        </div>`;
      el('fb-message').focus();
    }
    function closeFeedback() { const r = el('feedback-root'); if (r) r.innerHTML = ''; }
    async function sendFeedback() {
      const box = el('fb-status');
      const message = el('fb-message').value.trim();
      if (!message) { box.textContent = 'Skriv en beskrivning innan du skickar.'; box.className = 'status err'; return; }
      const systemInfo = {
        appVersion: APP_VERSION, page: location.hash || '#/', scope: state.scope, clinic: state.clinicName,
        userAgent: navigator.userAgent, screen: `${screen.width}x${screen.height}`, viewport: `${innerWidth}x${innerHeight}`,
        language: navigator.language, time: new Date().toISOString(), log: _sessionLog.slice(-20)
      };
      try {
        await api('/error-reports', { method: 'POST', body: { message, systemInfo } });
        box.textContent = 'Tack! Din felanmälan har skickats.'; box.className = 'status ok';
        setTimeout(closeFeedback, 1500);
      } catch (err) { box.textContent = 'Kunde inte skicka: ' + err.message; box.className = 'status err'; }
    }

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (state.token) headers.Authorization = 'Bearer ' + state.token;
      const res = await fetch(API_BASE + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      const fresh = res.headers.get('X-Refreshed-Token');
      if (fresh) { state.token = fresh; localStorage.setItem('opjour_token', fresh); }
      const isLogin = path === '/auth/login';
      if (res.status === 401 && !isLogin) { logout(); throw new Error('Sessionen har gått ut.'); }
      const text = await res.text();
      const data = text ? JSON.parse(text) : null;
      if (res.status === 403 && data?.mustChangePin) { showOnly('changepin'); throw new Error(data.error); }
      if (!res.ok) {
        logSession({ type: 'api', method: opts.method || 'GET', path: path.split('?')[0], status: res.status, error: data?.error || null });
        throw new Error(data?.error || ('HTTP ' + res.status));
      }
      return data;
    }

    function saveSession(token, scope, clinicName) {
      state.token = token; state.scope = scope; state.clinicName = clinicName || '';
      localStorage.setItem('opjour_token', token);
      localStorage.setItem('opjour_scope', scope);
      localStorage.setItem('opjour_clinic', state.clinicName);
    }

    function logout() {
      localStorage.removeItem('opjour_token');
      localStorage.removeItem('opjour_scope');
      localStorage.removeItem('opjour_clinic');
      location.reload();
    }

    function showOnly(id) {
      for (const s of ['login', 'changepin', 'app']) el(s).classList.toggle('hidden', s !== id);
    }

    // En inloggning för alla roller. Kontots roll avgör vyn: personlig vy eller (visningskonto) visningsskärmen.
    async function doLogin(e) {
      e.preventDefault();
      el('li-status').textContent = '';
      try {
        const r = await api('/auth/login', { method: 'POST', body: { username: el('li-username').value, pin: el('li-pin').value } });
        saveSession(r.token, r.scope, r.clinicName);
        el('li-pin').value = '';
        if (r.mustChangePin) { showOnly('changepin'); return false; }
        enterApp();
      } catch (err) { el('li-status').textContent = err.message; }
      return false;
    }

    async function doChangePin(e) {
      e.preventDefault();
      const a = el('cp-pin').value, b = el('cp-pin2').value;
      el('cp-status').textContent = '';
      if (a !== b) { el('cp-status').textContent = 'PIN-koderna matchar inte.'; return false; }
      try {
        await api('/auth/change-pin', { method: 'POST', body: { newPin: a } });
        enterApp();
      } catch (err) { el('cp-status').textContent = err.message; }
      return false;
    }

    document.addEventListener('DOMContentLoaded', () => { el('ver-login').textContent = 'ST-Lotsen ' + APP_VERSION; });

    function enterApp() {
      showOnly('app');
      el('app-clinic').textContent = state.clinicName;
      ['worlds', 'tools', 'subnav'].forEach(id => el(id).classList.toggle('hidden', state.scope !== 'user'));
      el('logout-btn').classList.toggle('hidden', state.scope === 'user');
      if (state.scope === 'display') { el('view').classList.add('wide'); renderDisplay(el('view')); }
      else route();
    }

    // Personlig vy: #/ (kalender), #/settings, #/admin. Visningsskärmen har ingen navigation.
    function route() {
      if (state.scope !== 'user') return;
      closeMenu();
      el('sheet-root')?.remove();
      if (typeof _app !== 'undefined' && _app) _app.sheet = null;
      if (typeof _sch !== 'undefined' && _sch) _sch.sheet = null;
      if (typeof _ov !== 'undefined' && _ov) _ov.sheet = null;
      const h = location.hash;
      markNav(h);
      const root = el('view');
      root.classList.toggle('wide', !['#/settings', '#/admin', '#/stats', '#/opjour-settings'].includes(h) && worldOf(h) !== 'today');   // bred vy för kalendern, schemat och ST-inställningarna
      if (h === '#/settings') renderSettings(root);
      else if (h === '#/admin') renderAdmin(root);
      else if (h === '#/opjour-settings') renderOpSettings(root);
      else if (h === '#/kalender') renderApp(root);
      else if (h === '#/stats') renderStats(root);
      else if (h === '#/schema') renderSchema(root);
      else if (h === '#/st' || h.startsWith('#/st/')) renderStSettings(root, h.split('/')[2]);
      else if (h === '#/schema/installningar') renderStSettings(root, 'typer', 'plan');
      else if (h === '#/oversikt') renderOversikt(root);
      else if (h === '#/plan' || h.startsWith('#/plan/')) renderPlan(root, h.slice('#/plan/'.length) || 'me');
      else renderToday(root);
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);

    function toggleMenu(e) {
      e.stopPropagation();
      const open = el('menu').classList.toggle('hidden') === false;
      el('menu-btn').setAttribute('aria-expanded', String(open));
    }
    function closeMenu() { el('menu').classList.add('hidden'); el('menu-btn').setAttribute('aria-expanded', 'false'); }
    document.addEventListener('click', e => { if (!el('menu-wrap').contains(e.target)) closeMenu(); });

    // Navigeringen (hybrid): varje sida hör till en "värld" — Idag, Opjour, Planering, ST-utbildning eller konto/klinik.
    // Världens flik i headern markeras och dess undersidor visas i vänsterspalten.
    function worldOf(h) {
      if (h === '#/settings' || h === '#/admin') return 'acc';
      if (h === '#/schema' || h.startsWith('#/schema/')) return 'plan';
      if (['#/oversikt', '#/st'].includes(h) || h.startsWith('#/st/') || h.startsWith('#/plan')) return 'st';
      if (['#/kalender', '#/stats', '#/opjour-settings'].includes(h)) return 'op';
      return 'today';
    }
    function markNav(h) {
      const world = worldOf(h), key = !h || h === '#' ? '#/' : h.startsWith('#/plan') ? '#/plan' : h.startsWith('#/st/') ? '#/st' : h;
      el('world-today').classList.toggle('active', world === 'today');
      el('world-op').classList.toggle('active', world === 'op');
      el('subnav').classList.toggle('hidden', state.scope !== 'user' || world === 'today');   // Idag har inga undersidor
      el('world-plan').classList.toggle('active', world === 'plan');
      el('world-st').classList.toggle('active', world === 'st');
      el('tool-admin').classList.toggle('active', h === '#/admin');
      el('subnav').querySelectorAll('[data-world]').forEach(g => g.classList.toggle('hidden', g.dataset.world !== world));
      document.querySelectorAll('#subnav a, #menu a').forEach(a => a.classList.toggle('active', a.dataset.route === key));
      scrollSubnav();
    }

    function scrollSubnav() {   // mobil: undersidorna är en vågrät rad — rulla fram den aktiva
      const act = el('subnav').querySelector('[data-world]:not(.hidden) a.active:not(.hidden)');
      if (act) el('subnav').scrollLeft = Math.max(0, act.offsetLeft - 40);
    }

    // Navigeringsval efter roll och klinikens moduler — anropas av varje vy när /me är hämtad.
    function setMenuForUser(me) {
      const mods = me.modules || ['opjour'], schema = mods.includes('schema'), mal = mods.includes('mal');
      const show = (id, on) => el(id).classList.toggle('hidden', !on);
      show('world-op', mods.includes('opjour'));
      show('nav-stats', me.canSeeStats && mods.includes('opjour'));
      show('nav-opset', me.isAdmin && mods.includes('opjour'));
      show('nav-schema', schema && (me.isSt || me.isDirector || me.isAdmin));
      show('nav-planset', schema && (me.isDirector || me.isAdmin));
      show('world-plan', schema && (me.isSt || me.isDirector || me.isAdmin));
      show('nav-oversikt', mal && (me.isSt || me.isDirector || me.isAdmin || me.isSupervisor));
      show('nav-plan', mal && me.isSt);
      show('nav-st', (schema || mal) && (me.isDirector || me.isAdmin));
      const firstSt = ['nav-oversikt', 'nav-plan', 'nav-st'].map(el).find(a => !a.classList.contains('hidden'));
      show('world-st', !!firstSt);
      if (firstSt) el('world-st').href = firstSt.getAttribute('href');
      ['nav-admin', 'menu-admin', 'tool-admin'].forEach(id => show(id, me.isAdmin));
      el('menu-btn').textContent = (me.displayName || 'Konto') + ' ▾';
      scrollSubnav();
    }

    // ── Delad kalender-render ──────────────────────────────
    // opts: { interactive, isMine(claim), actingId }
    // Visningsprioritet per dag: bokning > intresserade > reserv (reserv bara idag/framåt).
    // Interaktiva celler får data-act="day" + data-date; app.js öppnar dagsvyn.
    function buildCalendar(cal, opts) {
      const { fromISO, toISO } = cal.window;
      const claimByDate = new Map(cal.claims.map(c => [c.serviceDate, c]));
      let html = '<div class="cal-scroll"><div class="cal">';
      html += '<div class="cal-head">' + SV_DAYS.map(d => `<div>${d}</div>`).join('') + '</div>';

      let d = fromISO;
      while (d <= toISO) {
        html += `<div class="cal-week" data-week="Vecka ${isoWeek(d)}">`;
        for (let i = 0; i < 7; i++) {
          html += dayCell(d, claimByDate.get(d), cal, opts);
          d = addDaysISO(d, 1);
        }
        html += '</div>';
      }
      html += '</div></div>';
      return html;
    }

    function dayCell(dISO, claim, cal, opts) {
      const [y, m, day] = dISO.split('-').map(Number);
      const isToday = dISO === cal.todayISO;
      const isPast = dISO < cal.todayISO;
      const cls = ['day'];
      if (isToday) cls.push('today');
      if (isPast) cls.push('past');

      // Desktop visar dagnummer (månad vid den 1:a); mobil visar hela veckodagen + DD/MM.
      const wd = SV_DAYS_FULL[(new Date(dISO + 'T12:00:00Z').getUTCDay() + 6) % 7];
      let inner = `<span class="dnum"><span class="dwd">${wd} </span>`
        + `<span class="dn-short">${day === 1 ? SV_MONTHS[m - 1] + ' ' : ''}${day}</span>`
        + `<span class="dn-dm">${fmtDM(dISO)}</span>`
        + (isToday ? '<span class="today-pill">IDAG</span>' : '') + '</span>';
      const ints = (cal.interestsByDate && cal.interestsByDate[dISO]) || [];
      const person = (p, prefix = '') => `<li>${prefix}<span class="pn">${esc(p.displayName)}</span></li>`;

      if (claim) {
        if (opts.isMine && opts.isMine(claim)) cls.push('mine');
        inner += `<span class="who">${esc(claim.displayName)}</span>`;
        if (claim.createdByAdmin) inner += `<span class="badge-admin">bokad av admin</span>`;
        else if (claim.drawn) inner += `<span class="badge-admin">Utlottad</span>`;
      } else if (ints.length && !isPast) {
        cls.push('has-interest');
        if (opts.actingId && ints.some(i => i.userId === opts.actingId)) cls.push('my-interest');
        inner += `<span class="tag">intresse · ${ints.length}</span><ul class="plist cell">${ints.map(i => person(i)).join('')}</ul>`;
      } else if (!isPast) {
        const res = (cal.reservesByDate && cal.reservesByDate[dISO]) || [];
        if (isToday && opts.todayDetail && res.length) {
          inner += `<span class="tag" style="color:var(--ink-soft)">Reserv</span><ul class="plist cell">${res.map(r => person(r)).join('')}</ul>`;
        } else if (res.length) {
          inner += `<span class="res">Reserv: ${esc(res[0].displayName)}</span>`;
        }
      }

      if (!opts.interactive) return `<div class="${cls.join(' ')}">${inner}</div>`;
      cls.push('clickable');
      return `<div class="${cls.join(' ')}" role="button" tabindex="0" data-act="day" data-date="${dISO}">${inner}</div>`;
    }

    // Markerar celler där innehållet inte ryms (bara dator; mobilens rader växer). Klick öppnar ändå hela dagen.
    function markClippedCells() {
      const wide = window.matchMedia('(min-width: 641px)').matches;
      document.querySelectorAll('.day.clickable').forEach(c => c.classList.toggle('clipped', wide && c.scrollHeight > c.clientHeight + 1));
    }
    let _clipTimer = null;
    window.addEventListener('resize', () => { clearTimeout(_clipTimer); _clipTimer = setTimeout(markClippedCells, 120); });

    // Telefonnummer visas bara på visningsskärmen, för dagens opjour (backend skickar inga andra).
    function phoneLink(p) {
      if (!p) return '';
      return `<a class="phone" href="tel:${esc(p.replace(/[^\d+]/g, ''))}">${esc(p)}</a>`;
    }
    // Dagens datum i Stockholm (YYYY-MM-DD) — samma "idag" som servern räknar med.
    function todayStockholm() {
      return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    }
    function mondayOfISO(iso) {
      return addDaysISO(iso, -((new Date(iso + 'T12:00:00Z').getUTCDay() + 6) % 7));
    }
    function personLine(name, phone, prefix = '') {
      return `${prefix}<strong>${esc(name)}</strong>${phone ? ' · ' + phoneLink(phone) : ''}`;
    }

    // ISO-veckonummer (vecka 1 = veckan med årets första torsdag).
    function isoWeek(iso) {
      const d = new Date(iso + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3); // torsdagen i samma vecka
      const week1 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
      return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getUTCDay() + 6) % 7)) / 7);
    }

    function addDaysISO(iso, n) {
      const dt = new Date(iso + 'T12:00:00Z');
      dt.setUTCDate(dt.getUTCDate() + n);
      return dt.toISOString().slice(0, 10);
    }
    // DD/MM (med /ÅÅÅÅ om året inte är innevarande).
    function fmtDM(iso) {
      const [y, m, d] = iso.split('-');
      const thisYear = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Stockholm', year: 'numeric' }).format(new Date());
      return `${d}/${m}` + (y !== thisYear ? `/${y}` : '');
    }
    // "Fredag 30/10" — hela veckodagen + DD/MM.
    function fmtDateLong(iso) {
      return `${SV_DAYS_FULL[(new Date(iso + 'T12:00:00Z').getUTCDay() + 6) % 7]} ${fmtDM(iso)}`;
    }

    // ── Boot ──────────────────────────────────────────────
    // Måste vänta tills js/*.js laddats (de definierar renderApp m.fl. och körs efter detta skript);
    // annars blir sidan tom när man laddar om medan man är inloggad.
    document.addEventListener('DOMContentLoaded', () => {
      if (state.token && (state.scope === 'user' || state.scope === 'display')) enterApp();
      else showOnly('login');
    });
  </script>
